name: Deploy static webapp Website to EC2
on: push

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      EC2_HOST: ${{ secrets.EC2_HOST }}
      EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}

    steps:
      - name: Deploy to EC2
        run: |
          # 1. Clean and validate host
          HOST=$(echo "$EC2_HOST" | tr -d ' "\r\n' | sed -e 's/^.*@//')
          if [ -z "$HOST" ]; then
            echo "Error: EC2_HOST secret is empty or not configured in GitHub Secrets!"
            exit 1
          fi

          # 2. Setup SSH
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$EC2_SSH_KEY" | tr -d '\r' > ~/.ssh/ec2.pem
          chmod 600 ~/.ssh/ec2.pem
          ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts

          # 3. Connect and deploy (change ec2-user to ubuntu if using Ubuntu OS)
          ssh -i ~/.ssh/ec2.pem "ec2-user@$HOST" 'bash -se' <<'EOF'
          APP="/home/ec2-user/ec2-webapp"
          if [ -d "$APP/.git" ]; then
            cd "$APP"
            git checkout main
            git pull --ff-only origin main
          else
            git clone -b main "https://github.com/${{ github.repository }}.git" "$APP"
          fi
          EOF